<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ACcsp算法实验室 - NOI 2025 版</title>
    <style>
        :root { --bg: #020610; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); font-family: 'Consolas', 'PingFang SC', sans-serif; overflow: hidden; color: #fff; }
        
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        header { position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        h1 { margin: 0; font-size: 32px; background: linear-gradient(to right, #ff4d4d, #00a2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tag { position: absolute; padding: 8px 18px; border-radius: 50px; cursor: pointer; white-space: nowrap; font-weight: bold; font-size: 13px; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px); user-select: none; z-index: 10; }
        .tag:hover { transform: scale(1.3) !important; z-index: 1000 !important; box-shadow: 0 0 30px currentColor; background: rgba(255,255,255,0.1); }
        
        .diff-1-2 { color: #ff4d4d; border-color: #ff4d4d80; background: #ff4d4d1a; }
        .diff-3-4 { color: #ffa500; border-color: #ffa50080; background: #ffa5001a; }
        .diff-5-6 { color: #ffff00; border-color: #ffff0080; background: #ffff001a; }
        .diff-7   { color: #00ff00; border-color: #00ff0080; background: #00ff001a; }
        .diff-8   { color: #00a2ff; border-color: #00a2ff80; background: #00a2ff1a; }

        .legend { position: absolute; bottom: 20px; left: 20px; font-size: 11px; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #333; pointer-events: none; z-index: 100; }
        .lg-i { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<header>
    <h1>ACcsp算法实验室</h1>
    <div style="color: #888; font-size: 14px; margin-top: 5px;">基于 2025 NOI 大纲 · 全量算法空间</div>
</header>

<div id="box" style="position:relative; width: 100vw; height: 100vh; z-index: 5;"></div>

<div class="legend">
    <div class="lg-i"><span style="color:#ff4d4d">●</span> 难度 1-2 (入门基础语法/组合数学)</div>
    <div class="lg-i"><span style="color:#ffa500">●</span> 难度 3-4 (普及核心贪心/搜索)</div>
    <div class="lg-i"><span style="color:#ffff00">●</span> 难度 5-6 (提高基础DP/简单图论)</div>
    <div class="lg-i"><span style="color:#00ff00">●</span> 难度 7 (提高核心树形DP/高级图论)</div>
    <div class="lg-i"><span style="color:#00a2ff">●</span> 难度 8 (省选/NOI网络流/组合数学高级)</div>
</div>

<script>
// ─────────────── 星空 + 流星 ───────────────
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// 生成静态星星
const STAR_COUNT = 260;
const stars = Array.from({ length: STAR_COUNT }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.5 + 0.2,
    alpha: Math.random() * 0.7 + 0.3,
    // 闪烁参数
    twinkleSpeed: Math.random() * 0.02 + 0.005,
    twinkleOffset: Math.random() * Math.PI * 2,
}));

// 流星池
const meteors = [];

function spawnMeteor() {
    const angle = (Math.random() * 30 + 20) * Math.PI / 180; // 20~50° 斜角
    const len = Math.random() * 180 + 80;
    const speed = Math.random() * 10 + 8;
    const startX = Math.random() * window.innerWidth * 1.2;
    const startY = Math.random() * window.innerHeight * 0.5;
    meteors.push({
        x: startX, y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        len, speed,
        alpha: 1,
        width: Math.random() * 1.5 + 0.5,
        life: 1,          // 1→0
        decay: Math.random() * 0.012 + 0.008,
    });
}

// 随机安排下一颗流星
let nextMeteorIn = Math.random() * 3000 + 1000;
let lastTime = 0;

function drawStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 深空渐变底色
    const grad = ctx.createRadialGradient(
        canvas.width * 0.5, canvas.height * 0.4, 0,
        canvas.width * 0.5, canvas.height * 0.4, canvas.width * 0.75
    );
    grad.addColorStop(0, '#0a1628');
    grad.addColorStop(0.5, '#050e1f');
    grad.addColorStop(1, '#020610');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 画星星（带闪烁）
    stars.forEach(s => {
        const flicker = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset);
        const a = s.alpha * (0.6 + 0.4 * flicker);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fill();
    });
}

function drawMeteors() {
    meteors.forEach(m => {
        const tailX = m.x - m.vx / m.speed * m.len;
        const tailY = m.y - m.vy / m.speed * m.len;
        const grd = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
        grd.addColorStop(0, `rgba(255,255,255,0)`);
        grd.addColorStop(1, `rgba(200,220,255,${m.life * 0.9})`);
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(m.x, m.y);
        ctx.strokeStyle = grd;
        ctx.lineWidth = m.width;
        ctx.lineCap = 'round';
        ctx.stroke();

        // 头部光晕
        const glowR = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 4);
        glowR.addColorStop(0, `rgba(180,210,255,${m.life * 0.8})`);
        glowR.addColorStop(1, `rgba(180,210,255,0)`);
        ctx.beginPath();
        ctx.arc(m.x, m.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = glowR;
        ctx.fill();
    });
}

function animateSky(t) {
    requestAnimationFrame(animateSky);

    const dt = t - lastTime;
    lastTime = t;

    drawStars(t);

    // 流星计时
    nextMeteorIn -= dt;
    if (nextMeteorIn <= 0) {
        // 偶尔同时出现 2 颗
        spawnMeteor();
        if (Math.random() < 0.25) spawnMeteor();
        nextMeteorIn = Math.random() * 4000 + 1500;
    }

    // 更新 & 绘制流星
    for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.x += m.vx;
        m.y += m.vy;
        m.life -= m.decay;
        if (m.life <= 0 || m.x > canvas.width + 200 || m.y > canvas.height + 200) {
            meteors.splice(i, 1);
        }
    }
    drawMeteors();
}

requestAnimationFrame(animateSky);

// ─────────────── 算法标签浮动 ───────────────
const algos = [
    { n: "C++语法基础", d: 1 }, { n: "控制结构", d: 1 }, { n: "函数与递归", d: 2 }, { n: "简单数组", d: 2 },
    { n: "整数最大公约数", d: 2 }, { n: "菲波那契数列", d: 2 }, { n: "简单逻辑与集合", d: 2 },
    { n: "冒泡/插入排序", d: 3 }, { n: "贪心算法基础", d: 3 }, { n: "排列组合基础", d: 4 }, { n: "二分查找", d: 4 },
    { n: "哈希表", d: 4 }, { n: "栈与队列", d: 4 }, { n: "简单模拟", d: 3 }, { n: "网格图BFS", d: 4 },
    { n: "线性DP", d: 5 }, { n: "背包问题", d: 5 }, { n: "并查集", d: 5 }, { n: "Dijkstra最短路", d: 5 },
    { n: "Kruskal最小生成树", d: 6 }, { n: "树状数组", d: 6 }, { n: "线段树", d: 6 }, { n: "拓扑排序", d: 6 },
    { n: "简单数论 (质数/模算)", d: 5 }, { n: "二叉搜索树", d: 6 }, { n: "分治算法", d: 5 },
    { n: "区间DP", d: 7 }, { n: "树形DP", d: 7 }, { n: "状态压缩DP", d: 7 }, { n: "网络流基础", d: 7 },
    { n: "Tarjan强连通", d: 7 }, { n: "倍增LCA", d: 7 }, { n: "ST表 (RMQ)", d: 7 }, { n: "组合数学进阶", d: 7 },
    { n: "矩阵乘法", d: 7 }, { n: "欧拉路径与回路", d: 7 }, { n: "动态数论 (CRT/逆元)", d: 7 },
    { n: "最大流与最小割", d: 8 }, { n: "费用流算法", d: 8 }, { n: "CDQ分治", d: 8 }, { n: "莫队算法", d: 8 },
    { n: "FFT快速傅里叶", d: 8 }, { n: "动态树 (LCT)", d: 8 }, { n: "平衡树 (Splay/Treap)", d: 8 }, { n: "生成函数", d: 8 },
    { n: "后缀自动机/数", d: 8 }, { n: "莫比乌斯反演", d: 8 }, { n: "博弈论", d: 8 }, { n: "离线算法", d: 8 }
];

const box = document.getElementById('box');
const items = [];

class Label {
    constructor(info) {
        const el = document.createElement('div');
        const cls = info.d <= 2 ? '1-2' : info.d <= 4 ? '3-4' : info.d <= 6 ? '5-6' : info.d === 7 ? '7' : '8';
        el.className = `tag diff-${cls}`;
        el.innerText = info.n;
        box.appendChild(el);

        this.el = el;
        this.w = el.offsetWidth;
        this.h = el.offsetHeight;
        this.x = Math.random() * (window.innerWidth - this.w);
        this.y = Math.random() * (window.innerHeight - this.h);
        this.vx = (Math.random() - 0.5) * 1.1;
        this.vy = (Math.random() - 0.5) * 1.1;
        this.stop = false;

        el.onmouseenter = () => this.stop = true;
        el.onmouseleave = () => this.stop = false;
    }

    move() {
        if (!this.stop) {
            this.x += this.vx; this.y += this.vy;
            if (this.x <= 0 || this.x + this.w >= window.innerWidth) this.vx *= -1;
            if (this.y <= 0 || this.y + this.h >= window.innerHeight) this.vy *= -1;
        }
        this.el.style.transform = `translate(${this.x}px, ${this.y}px)`;
    }
}

function runTags() {
    algos.forEach(a => items.push(new Label(a)));
    const frame = () => {
        items.forEach(i => i.move());
        requestAnimationFrame(frame);
    };
    frame();
}

window.onresize = () => {
    resize();
    items.forEach(i => {
        i.x = Math.min(i.x, window.innerWidth - i.w);
        i.y = Math.min(i.y, window.innerHeight - i.h);
    });
};

runTags();
</script>
</body>
</html>

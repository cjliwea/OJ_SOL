<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杨老师的算法实验室 - 悬浮算法空间</title>
    <style>
        :root {
            --bg: #050a0f;
            --j-color: #00ffcc;
            --s-color: #ff3399;
            --j-bg: rgba(0, 255, 204, 0.1);
            --s-bg: rgba(255, 51, 153, 0.1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg);
            font-family: 'Consolas', 'PingFang SC', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* 顶部标题栏 */
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }

        h1 { margin: 0; font-size: 28px; background: linear-gradient(to right, #00ffcc, #ff3399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { margin: 5px 0; font-size: 12px; color: #555; }

        /* 标签容器 */
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* 算法标签样式 */
        .algo-tag {
            position: absolute;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        /* J组颜色 */
        .tag-j {
            color: var(--j-color);
            background: var(--j-bg);
            border-color: rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        /* S组颜色 */
        .tag-s {
            color: var(--s-color);
            background: var(--s-bg);
            border-color: rgba(255, 51, 153, 0.3);
            box-shadow: 0 0 15px rgba(255, 51, 153, 0.1);
        }

        .algo-tag:hover {
            transform: scale(1.2);
            z-index: 999 !important;
            box-shadow: 0 0 25px currentColor;
            background: rgba(255, 255, 255, 0.15);
        }

        /* 说明文字 */
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            color: #444;
        }
    </style>
</head>
<body>

<header>
    <h1>杨老师算法实验室</h1>
    <p>ACcsp OJ 官方可视化空间 · 犇犇的成长笔记</p>
</header>

<div id="container"></div>

<div class="legend">
    <span style="color: var(--j-color)">●</span> CSP-J 普及组 &nbsp;
    <span style="color: var(--s-color)">●</span> CSP-S 提高组
</div>

<script>
    const algorithms = [
        { name: "BFS 广搜", type: "j" },
        { name: "DFS 深搜", type: "j" },
        { name: "快速排序", type: "j" },
        { name: "区间 DP", type: "s" },
        { name: "状态压缩 DP", type: "s" },
        { name: "贪心算法", type: "j" },
        { name: "Dijkstra", type: "j" },
        { name: "线段树", type: "s" },
        { name: "Tarjan 强连通", type: "s" },
        { name: "倍增 LCA", type: "s" },
        { name: "欧拉路径", type: "j" },
        { name: "单调队列", type: "j" },
        { name: "网络流", type: "s" },
        { name: "二分图匹配", type: "s" },
        { name: "拓扑排序", type: "j" },
        { name: "博弈论", type: "s" },
        { name: "数学基础", type: "j" }
    ];

    const container = document.getElementById('container');
    const tags = [];

    class Tag {
        constructor(info) {
            this.element = document.createElement('div');
            this.element.className = `algo-tag tag-${info.type}`;
            this.element.innerText = info.name;
            container.appendChild(this.element);

            // 随机初始位置
            this.w = this.element.offsetWidth;
            this.h = this.element.offsetHeight;
            this.x = Math.random() * (window.innerWidth - this.w);
            this.y = Math.random() * (window.innerHeight - this.h);
            
            // 随机初速度
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = (Math.random() - 0.5) * 1.5;

            this.hovered = false;
            this.element.onmouseenter = () => this.hovered = true;
            this.element.onmouseleave = () => this.hovered = false;
            this.element.onclick = () => alert(`跳转到 ${info.name} 的可视化演示...`);
        }

        update() {
            if (!this.hovered) {
                this.x += this.vx;
                this.y += this.vy;

                // 碰到左右边缘反弹
                if (this.x <= 0 || this.x + this.w >= window.innerWidth) {
                    this.vx *= -1;
                }
                // 碰到上下边缘反弹
                if (this.y <= 0 || this.y + this.h >= window.innerHeight) {
                    this.vy *= -1;
                }
            }
            this.element.style.transform = `translate(${this.x}px, ${this.y}px) ${this.hovered ? 'scale(1.2)' : 'scale(1)'}`;
        }
    }

    // 初始化标签
    function init() {
        algorithms.forEach(item => {
            tags.push(new Tag(item));
        });
        animate();
    }

    function animate() {
        tags.forEach(t => t.update());
        requestAnimationFrame(animate);
    }

    // 窗口大小变化时重置
    window.onresize = () => {
        tags.forEach(t => {
            t.x = Math.min(t.x, window.innerWidth - t.w);
            t.y = Math.min(t.y, window.innerHeight - t.h);
        });
    };

    init();
</script>

</body>
</html>

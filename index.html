<script>
// ─────────── 星空 ───────────
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize',resize);

const stars = Array.from({length:280},()=>({
  x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
  r:Math.random()*1.5+0.2, a:Math.random()*0.7+0.3,
  ts:Math.random()*0.02+0.005, to:Math.random()*Math.PI*2
}));
const meteors=[]; let nextM=Math.random()*3000+1500, lastT=0;
function spawnM(){
  const ang=(Math.random()*30+20)*Math.PI/180, sp=Math.random()*10+8;
  meteors.push({x:Math.random()*window.innerWidth*1.2,y:Math.random()*window.innerHeight*0.5,
    vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,len:Math.random()*180+70,sp,
    life:1,decay:Math.random()*0.012+0.008,w:Math.random()*1.4+0.4});
}
requestAnimationFrame(function skyF(t){
  requestAnimationFrame(skyF);
  const dt=t-lastT; lastT=t;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const g=ctx.createRadialGradient(canvas.width*.5,canvas.height*.4,0,canvas.width*.5,canvas.height*.4,canvas.width*.75);
  g.addColorStop(0,'#0b1830'); g.addColorStop(.5,'#060f20'); g.addColorStop(1,'#020610');
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    const f=.55+.45*Math.sin(t*s.ts+s.to);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.a*f})`; ctx.fill();
  });
  nextM-=dt; if(nextM<=0){spawnM();if(Math.random()<.25)spawnM();nextM=Math.random()*4500+1500;}
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i]; m.x+=m.vx; m.y+=m.vy; m.life-=m.decay;
    if(m.life<=0||m.x>canvas.width+200||m.y>canvas.height+200){meteors.splice(i,1);continue;}
    const tx=m.x-m.vx/m.sp*m.len,ty=m.y-m.vy/m.sp*m.len;
    const mg=ctx.createLinearGradient(tx,ty,m.x,m.y);
    mg.addColorStop(0,'rgba(255,255,255,0)'); mg.addColorStop(1,`rgba(200,220,255,${m.life*.85})`);
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(m.x,m.y);
    ctx.strokeStyle=mg; ctx.lineWidth=m.w; ctx.lineCap='round'; ctx.stroke();
  }
});

// 颜色配置
const DCOLOR = ['','#ff4d4d','#ff7a00','#ffd000','#00ff88','#00a2ff'];
const DLABEL = ['','难度 1-2 · 入门级基础','难度 3-4 · 入门级核心','难度 5-6 · 提高级','难度 7 · 提高级核心','难度 8-10 · NOI/IOI 级'];

const box = document.getElementById('box');
const items = [];
let paused = false;

class Label {
  constructor(info){
    const el = document.createElement('div');
    el.className = `tag diff-${info.d}`;
    el.innerText = info.n;
    box.appendChild(el);
    this.el=el; this.info=info;
    this.w=el.offsetWidth; this.h=el.offsetHeight;
    this.x=Math.random()*(window.innerWidth-this.w);
    this.y=Math.random()*(window.innerHeight-this.h);
    this.vx=(Math.random()-.5)*(0.6+info.d*0.15);
    this.vy=(Math.random()-.5)*(0.6+info.d*0.15);
    this.hover=false;
    el.onmouseenter=()=>this.hover=true;
    el.onmouseleave=()=>this.hover=false;
    el.onclick=()=>openPanel(info);
  }
  move(){
    if(!this.hover&&!paused){
      this.x+=this.vx; this.y+=this.vy;
      if(this.x<=0||this.x+this.w>=window.innerWidth) this.vx*=-1;
      if(this.y<=0||this.y+this.h>=window.innerHeight) this.vy*=-1;
    }
    this.el.style.transform=`translate(${this.x}px,${this.y}px)`;
  }
}
algos.forEach(a=>items.push(new Label(a)));
(function tagF(){ items.forEach(i=>i.move()); requestAnimationFrame(tagF); })();
window.onresize=()=>{ resize(); items.forEach(i=>{i.x=Math.min(i.x,window.innerWidth-i.w);i.y=Math.min(i.y,window.innerHeight-i.h);}); };

// ─────────── 详情面板 ───────────
const panel   = document.getElementById('panel');
const pTitle  = document.getElementById('panel-title');
const pBadges = document.getElementById('panel-badges');
const pContent= document.getElementById('panel-content');
const pLoad   = document.getElementById('loading-wrap');
const cache   = {};

function closePanel(){ panel.classList.remove('open'); paused=false; }

function badge(text, color){
  const s=document.createElement('span');
  s.className='badge';
  s.textContent=text;
  s.style.color=color; s.style.borderColor=color+'55'; s.style.background=color+'10';
  return s;
}

async function openPanel(info){
  paused=true;
  pTitle.textContent=info.n;
  pBadges.innerHTML='';
  const c=DCOLOR[info.d];
  pBadges.appendChild(badge(DLABEL[info.d], c));
  pBadges.appendChild(badge(info.level, '#88aacc'));
  pBadges.appendChild(badge(info.cat, '#667788'));
  pBadges.appendChild(badge(`大纲 §${info.section}`, '#445566'));
  panel.classList.add('open');

  if(cache[info.n]){ pContent.innerHTML=cache[info.n]; pLoad.style.display='none'; return; }

  pContent.innerHTML=''; pLoad.style.display='flex';

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:1000,
        system:`你是 NOI/CSP 算法竞赛专家，熟读《全国青少年信息学奥林匹克系列竞赛大纲（2025年修订版）》。
用户点击了一个算法知识点标签，请严格以下列 JSON 格式返回详细说明（只输出 JSON，不要 markdown 代码块）:
{
  "summary": "一句话简介（25字以内）",
  "complexity_time": "时间复杂度，如 O(n log n)",
  "complexity_space": "空间复杂度，如 O(n)",
  "syllabus_text": "大纲原文相关条目的简要描述（基于2025大纲实际内容，30字以内）",
  "core_ideas": ["核心思想1","核心思想2","核心思想3"],
  "typical_problems": ["经典题目/题型1","经典题目/题型2","经典题目/题型3"],
  "keywords": ["关键词1","关键词2","关键词3","关键词4"],
  "study_tip": "学习建议（40字以内）",
  "prerequisites": ["前置知识1","前置知识2"]
}`,
        messages:[{role:'user',content:`知识点名称：${info.n}
大纲位置：${info.level} § ${info.section} (${info.cat})
大纲原始难度系数：【${info.raw}】
`}]
      })
    });
    const data=await resp.json();
    const raw=(data.content||[]).map(b=>b.text||'').join('');
    const obj=JSON.parse(raw.replace(/```json|```/g,'').trim());

    const html=`
<div class="sec">
  <div class="sec-label">简介</div>
  <div class="sec-body">${obj.summary}</div>
</div>
<div class="sec">
  <div class="sec-label">大纲原文定位</div>
  <div class="syllabus-block">§ ${info.section} · ${info.cat}<br>${obj.syllabus_text}</div>
</div>
<div class="sec">
  <div class="sec-label">复杂度</div>
  <div class="cbox">时间：${obj.complexity_time}&nbsp;&nbsp;|&nbsp;&nbsp;空间：${obj.complexity_space}</div>
</div>
<div class="sec">
  <div class="sec-label">前置知识</div>
  <div class="chip-row">${(obj.prerequisites||[]).map(k=>`<span class="chip">${k}</span>`).join('')}</div>
</div>
<div class="sec">
  <div class="sec-label">核心思想</div>
  <ul class="item-list">${(obj.core_ideas||[]).map(s=>`<li>${s}</li>`).join('')}</ul>
</div>
<div class="sec">
  <div class="sec-label">经典题目 / 题型</div>
  <ul class="item-list">${(obj.typical_problems||[]).map(s=>`<li>${s}</li>`).join('')}</ul>
</div>
<div class="sec">
  <div class="sec-label">关键词</div>
  <div class="chip-row">${(obj.keywords||[]).map(k=>`<span class="chip">${k}</span>`).join('')}</div>
</div>
<div class="sec" style="margin-bottom:0">
  <div class="sec-label">学习建议</div>
  <div class="sec-body">${obj.study_tip}</div>
</div>`;
    cache[info.n]=html;
    pLoad.style.display='none'; pContent.innerHTML=html;
  } catch(e){
    pLoad.style.display='none';
    pContent.innerHTML=`<div style="color:#f55;padding:16px 0">加载失败，请重试。<br><small>${e.message}</small></div>`;
  }
}

document.getElementById('box').addEventListener('click',e=>{
  if(!e.target.classList.contains('tag')) closePanel();
});
</script>
</body>

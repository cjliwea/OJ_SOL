<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ACcsp算法实验室 - NOI 2025 版</title>
<style>
:root{--bg:#020610;}
*,*::before,*::after{box-sizing:border-box;}
body,html{margin:0;padding:0;width:100%;height:100%;background:var(--bg);font-family:'Consolas','PingFang SC',monospace;overflow:hidden;color:#fff;}

header{position:absolute;top:20px;left:20px;z-index:100;pointer-events:none;}
h1{margin:0;font-size:28px;background:linear-gradient(to right,#ff4d4d,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.tag{position:absolute;padding:6px 14px;border-radius:50px;cursor:pointer;white-space:nowrap;font-weight:bold;font-size:12px;transition:transform 0.15s,box-shadow 0.15s;border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(4px);user-select:none;z-index:10;}
.tag:hover{transform:scale(1.35)!important;z-index:1000!important;box-shadow:0 0 28px currentColor;}
.diff-1{color:#ff4d4d;border-color:#ff4d4d55;background:#ff4d4d12;}
.diff-2{color:#ff7a00;border-color:#ff7a0055;background:#ff7a0012;}
.diff-3{color:#ffd000;border-color:#ffd00055;background:#ffd00012;}
.diff-4{color:#00ff88;border-color:#00ff8855;background:#00ff8812;}

/* ── 详情面板 ── */
#panel{position:fixed;top:0;right:-480px;width:460px;height:100%;background:rgba(4,11,28,0.96);border-left:1px solid rgba(255,255,255,0.07);backdrop-filter:blur(20px);z-index:2000;display:flex;flex-direction:column;transition:right 0.38s cubic-bezier(0.4,0,0.2,1);overflow:hidden;}
#panel.open{right:0;}
#ph{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:flex-start;gap:10px;}
#pm{flex:1;}
#pt{font-size:20px;font-weight:bold;line-height:1.3;margin-bottom:7px;}
#pb{display:flex;flex-wrap:wrap;gap:5px;}
.bdg{font-size:11px;padding:2px 9px;border-radius:50px;border:1px solid;white-space:nowrap;}
#pc-btn{background:none;border:none;color:#556;cursor:pointer;font-size:18px;padding:0;flex-shrink:0;margin-top:2px;transition:color .2s;}
#pc-btn:hover{color:#fff;}
#pb-body{flex:1;overflow-y:auto;padding:18px 20px;scrollbar-width:thin;scrollbar-color:#1e2e44 transparent;}
#pb-body::-webkit-scrollbar{width:4px;}
#pb-body::-webkit-scrollbar-thumb{background:#1e2e44;border-radius:4px;}
.sec{margin-bottom:16px;}
.sec-lbl{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#445566;margin-bottom:6px;}
.sec-body{font-size:13.5px;line-height:1.85;color:#b8c8dc;}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;}
.chip{font-size:11px;padding:3px 9px;border-radius:50px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);color:#8899aa;}
.cbox{background:rgba(0,200,150,0.07);border:1px solid rgba(0,200,150,0.18);border-radius:8px;padding:9px 14px;font-size:13px;color:#55ddaa;font-family:'Consolas',monospace;}
.ilist{list-style:none;padding:0;margin:0;}
.ilist li{padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;color:#a0b4c8;}
.ilist li::before{content:"› ";color:#334455;}
.sylbox{background:rgba(255,208,0,0.05);border-left:2px solid #ffd00040;padding:9px 12px;border-radius:0 6px 6px 0;font-size:12.5px;line-height:1.8;color:#ccbb77;}

.legend{position:absolute;bottom:18px;left:18px;font-size:11px;display:flex;flex-direction:column;gap:7px;background:rgba(0,0,0,0.65);padding:12px 14px;border-radius:8px;border:1px solid #1a2535;pointer-events:none;z-index:100;}
.lg-i{display:flex;align-items:center;gap:8px;}
.hint{position:absolute;bottom:20px;right:20px;font-size:11px;color:#334455;z-index:100;pointer-events:none;}
</style>
</head>
<body>
<canvas id="starCanvas"></canvas>
<header>
  <h1>ACcsp算法实验室</h1>
  <div style="color:#445;font-size:12px;margin-top:4px;">NOI 2025 大纲 · 入门级 & 提高级 · 点击标签查看详情</div>
</header>
<div id="box" style="position:relative;width:100vw;height:100vh;z-index:5;"></div>

<div id="panel">
  <div id="ph">
    <div id="pm">
      <div id="pt">—</div>
      <div id="pb"></div>
    </div>
    <button id="pc-btn" onclick="closePanel()">✕</button>
  </div>
  <div id="pb-body"><div id="pc"></div></div>
</div>

<div class="legend">
  <div class="lg-i"><span style="color:#ff4d4d">●</span> 难度 1-2 · 入门级基础（CSP-J）</div>
  <div class="lg-i"><span style="color:#ff7a00">●</span> 难度 3-4 · 入门级核心（CSP-J）</div>
  <div class="lg-i"><span style="color:#ffd000">●</span> 难度 5-6 · 提高级（CSP-S / NOIP）</div>
  <div class="lg-i"><span style="color:#00ff88">●</span> 难度 7 · 提高级核心（NOIP）</div>
</div>
<div class="hint">点击标签查看大纲详解</div>

<script>
// ── 星空 ──────────────────────────────────────────────────
const canvas=document.getElementById('starCanvas'),ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
const stars=Array.from({length:260},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+0.2,a:Math.random()*0.7+0.3,ts:Math.random()*.02+.005,to:Math.random()*Math.PI*2}));
const meteors=[];let nextM=Math.random()*3000+1500,lastT=0;
function spawnM(){const ang=(Math.random()*30+20)*Math.PI/180,sp=Math.random()*10+8;meteors.push({x:Math.random()*innerWidth*1.2,y:Math.random()*innerHeight*.5,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,len:Math.random()*180+70,sp,life:1,decay:Math.random()*.012+.008,w:Math.random()*1.3+0.4});}
requestAnimationFrame(function sky(t){
  requestAnimationFrame(sky);const dt=t-lastT;lastT=t;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const g=ctx.createRadialGradient(canvas.width*.5,canvas.height*.4,0,canvas.width*.5,canvas.height*.4,canvas.width*.75);
  g.addColorStop(0,'#0b1830');g.addColorStop(.5,'#060f20');g.addColorStop(1,'#020610');
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{const f=.55+.45*Math.sin(t*s.ts+s.to);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a*f})`;ctx.fill();});
  nextM-=dt;if(nextM<=0){spawnM();if(Math.random()<.25)spawnM();nextM=Math.random()*4500+1500;}
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx;m.y+=m.vy;m.life-=m.decay;
    if(m.life<=0||m.x>canvas.width+200||m.y>canvas.height+200){meteors.splice(i,1);continue;}
    const tx=m.x-m.vx/m.sp*m.len,ty=m.y-m.vy/m.sp*m.len;
    const mg=ctx.createLinearGradient(tx,ty,m.x,m.y);mg.addColorStop(0,'rgba(255,255,255,0)');mg.addColorStop(1,`rgba(200,220,255,${m.life*.85})`);
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);ctx.strokeStyle=mg;ctx.lineWidth=m.w;ctx.lineCap='round';ctx.stroke();}
});

// ── 知识点数据（来自 NOI 2025 大纲原文 + 详细说明）──────────
// d: 1=入门基础 2=入门核心 3=提高基础 4=提高核心
const algos = [
  // ══ 入门级基础 (大纲难度 1-2) ══════════════════════════════════════
  {n:"枚举法", d:1, raw:"【1】", section:"2.1.4 算法·入门算法",
   summary:"通过逐一列举所有可能的解来找到答案，是最基础的暴力搜索思路。",
   complexity:"时间 O(n) ~ O(nᵏ)，取决于枚举维度 | 空间 O(1)",
   syllabus:"§2.1.4 入门算法·枚举法【1】",
   ideas:["遍历解空间中所有候选解","对每个候选解判断是否满足约束条件","通过剪枝减少不必要的枚举"],
   problems:["百钱百鸡问题","水仙花数","找出满足条件的三元组"],
   keywords:["暴力","穷举","解空间","剪枝"],
   tip:"先从最简单的暴力枚举开始，理解问题结构后再考虑优化。"},

  {n:"模拟法", d:1, raw:"【1】", section:"2.1.4 算法·入门算法",
   summary:"按照题目描述的规则，直接用代码模拟操作过程，忠实还原题意。",
   complexity:"时间 O(n·步骤数) | 空间 O(n)",
   syllabus:"§2.1.4 入门算法·模拟法【1】",
   ideas:["直接按题目流程一步步实现","维护操作状态（位置、计数器等）","注意边界和特殊情况处理"],
   problems:["日期计算","报数游戏","走迷宫步骤追踪"],
   keywords:["直接实现","状态维护","边界处理","过程模拟"],
   tip:"模拟题的关键是读懂题意，要细心处理各种边界情形。"},

  {n:"递归函数", d:1, raw:"【2】", section:"2.1.2 C++程序设计·函数与递归",
   summary:"函数直接或间接调用自身，将大问题分解为同结构的小问题求解。",
   complexity:"时间 O(递归树节点数) | 空间 O(递归深度)（栈空间）",
   syllabus:"§2.1.2 函数与递归·递归函数【2】",
   ideas:["定义递归出口（base case）避免无限递归","将原问题归约为规模更小的子问题","每次调用参数向出口方向收敛"],
   problems:["汉诺塔","阶乘计算","斐波那契数列（递归版）","全排列生成"],
   keywords:["递归出口","子问题","调用栈","分治思想"],
   tip:"画出递归树帮助理解调用过程，注意栈溢出风险（深度过大时改迭代）。"},

  {n:"加法/乘法原理", d:1, raw:"【2】", section:"2.1.5 数学·离散组合数学",
   summary:"分步计数用乘法原理，分类计数用加法原理，是组合数学的计数基础。",
   complexity:"O(1) — 公式直接计算",
   syllabus:"§2.1.5 离散与组合数学·加法原理【2】·乘法原理【2】",
   ideas:["加法原理：各类方案互斥时总数相加","乘法原理：各步独立时方案数相乘","复杂计数问题可逐步拆分后组合"],
   problems:["密码方案数","路径计数","棋盘着色方案"],
   keywords:["计数","分步","分类","组合数学基础"],
   tip:"先判断是"分步完成"还是"分类完成"，再套对应原理。"},

  {n:"进制转换", d:1, raw:"【1】", section:"2.1.5 数学·数及其运算",
   summary:"在二进制、八进制、十进制、十六进制之间互相转换，是计算机数学基础。",
   complexity:"O(log n)（n 为数值大小）",
   syllabus:"§2.1.5 数及其运算·进制与进制转换【1】",
   ideas:["十进制→其他进制：反复除以基数取余","其他进制→十进制：按位权展开求和","二进制与十六进制互转：4位一组直接映射"],
   problems:["整数进制转换","判断某进制下的回文数"],
   keywords:["二进制","十六进制","位权","取余"],
   tip:"竞赛中二进制位运算与进制转换结合考查最多，要熟练掌握位运算。"},

  // ══ 入门级核心 (大纲难度 3-4) ══════════════════════════════════════
  {n:"冒泡排序", d:2, raw:"【3】", section:"2.1.4 算法·排序算法",
   summary:"相邻元素两两比较交换，每趟将最大值"冒泡"到末尾。",
   complexity:"时间 O(n²) | 空间 O(1)（原地）",
   syllabus:"§2.1.4 排序算法·冒泡排序【3】",
   ideas:["外层 n-1 趟，内层逐个比较相邻元素","若已有序可提前终止（优化版）","稳定排序（相等元素相对顺序不变）"],
   problems:["对小规模数组排序","验证比较排序下界"],
   keywords:["相邻比较","稳定排序","O(n²)","原地排序"],
   tip:"理解稳定性概念；实际比赛直接用 sort()，冒泡用于理解比较排序原理。"},

  {n:"选择排序", d:2, raw:"【3】", section:"2.1.4 算法·排序算法",
   summary:"每趟从剩余元素中找最小值放到已排序区末尾，共进行 n-1 趟。",
   complexity:"时间 O(n²) | 空间 O(1)",
   syllabus:"§2.1.4 排序算法·选择排序【3】",
   ideas:["维护已排序前缀和未排序后缀","每趟在未排序部分找最小值","将最小值与未排序区首元素交换"],
   problems:["排序基础训练","与其他排序算法对比"],
   keywords:["最小值","交换","不稳定","原地"],
   tip:"选择排序交换次数最少（O(n) 次），但比较次数仍是 O(n²)。"},

  {n:"插入排序", d:2, raw:"【3】", section:"2.1.4 算法·排序算法",
   summary:"将未排序元素逐一插入到已排序序列的正确位置，类似整理扑克牌。",
   complexity:"时间 O(n²)，近有序数据接近 O(n) | 空间 O(1)",
   syllabus:"§2.1.4 排序算法·插入排序【3】",
   ideas:["维护已排序前缀，逐步扩展","当前元素向左与已排序元素比较，找到插入位置","对小规模数据或近似有序数据高效"],
   problems:["小数组排序","归并/快排的优化底层"],
   keywords:["插入","稳定","近有序","O(n²)"],
   tip:"希尔排序是插入排序的升级版；理解插入排序对理解归并排序有帮助。"},

  {n:"贪心法", d:2, raw:"【3】", section:"2.1.4 算法·基础算法",
   summary:"每步做出当前局部最优选择，以期得到全局最优解。",
   complexity:"通常 O(n log n)（含排序）",
   syllabus:"§2.1.4 基础算法·贪心法【3】",
   ideas:["证明贪心选择性质（局部最优推全局最优）","将问题排序或优先队列处理","贪心策略不一定总成立，需严格证明"],
   problems:["活动选择问题","区间调度","硬币找零（整除情形）","任务调度最小完成时间"],
   keywords:["局部最优","全局最优","证明","活动选择"],
   tip:"贪心最难点是证明正确性，常用"交换论证法"或数学归纳法。"},

  {n:"递推法", d:2, raw:"【3】", section:"2.1.4 算法·基础算法",
   summary:"从初始状态出发，根据递推关系逐步推导出后续状态，迭代得到答案。",
   complexity:"时间 O(n) ~ O(n²) | 空间 O(n) 或 O(1)（滚动优化）",
   syllabus:"§2.1.4 基础算法·递推法【3】",
   ideas:["建立 f(n) 与 f(n-1)...f(1) 的递推关系","确定初始值（边界条件）","自底向上迭代计算避免重复"],
   problems:["斐波那契数列","爬楼梯","矩阵快速幂加速递推"],
   keywords:["状态转移","初始值","自底向上","迭代"],
   tip:"递推和动态规划本质相同；递推更偏向简单线性关系，DP 更复杂。"},

  {n:"前缀和", d:2, raw:"【3】", section:"2.1.4 算法·算法策略",
   summary:"预处理数组的前缀累计和，使区间求和从 O(n) 降为 O(1)。",
   complexity:"预处理 O(n)，查询 O(1) | 空间 O(n)",
   syllabus:"§2.1.4 算法策略·前缀和【3】",
   ideas:["pre[i] = pre[i-1] + a[i]","区间 [l,r] 之和 = pre[r] - pre[l-1]","可扩展至二维前缀和"],
   problems:["区间求和查询","子数组和等于 k 的方案数","二维矩阵子矩阵求和"],
   keywords:["区间查询","O(1)查询","差分逆操作","二维扩展"],
   tip:"前缀和与差分互为逆操作，是竞赛中最高频的预处理技巧之一。"},

  {n:"差分", d:2, raw:"【4】", section:"2.1.4 算法·算法策略",
   summary:"对差分数组进行区间加法操作，求前缀和还原原数组，实现 O(1) 区间修改。",
   complexity:"预处理 O(n)，单次修改 O(1)，还原 O(n) | 空间 O(n)",
   syllabus:"§2.1.4 算法策略·差分【4】",
   ideas:["差分数组 d[i] = a[i] - a[i-1]","[l,r]+val：d[l]+=val, d[r+1]-=val","对差分数组求前缀和得修改后原数组"],
   problems:["区间加法修改","航班座位预订（多次区间加）","公交乘客统计"],
   keywords:["区间修改","O(1)修改","前缀和逆操作","差分数组"],
   tip:"差分是前缀和的逆操作；二维差分用于矩阵子矩阵批量加法。"},

  {n:"递归法", d:2, raw:"【4】", section:"2.1.4 算法·基础算法",
   summary:"将大问题拆分为若干相同结构的子问题递归求解，是分治、搜索的基础。",
   complexity:"取决于递归树结构，常见 O(n)、O(n log n)、O(2ⁿ)",
   syllabus:"§2.1.4 基础算法·递归法【4】",
   ideas:["定义明确的递归终止条件","每次调用规模严格缩小","利用系统栈保存中间状态"],
   problems:["汉诺塔","全排列","二分搜索递归版","归并排序"],
   keywords:["递归终止","子问题","系统栈","分而治之"],
   tip:"能用递归的地方通常也能改为迭代+显式栈，注意递归深度限制（约 1 万层）。"},

  {n:"二分法", d:2, raw:"【4】", section:"2.1.4 算法·基础算法",
   summary:"在有序区间内每次折半缩小搜索范围，以 O(log n) 定位目标。",
   complexity:"时间 O(log n) | 空间 O(1)",
   syllabus:"§2.1.4 基础算法·二分法【4】",
   ideas:["维护可行区间 [lo, hi]，每次取中点判断","分清「找第一个满足条件的位置」和「找最后一个」","二分答案：对答案值域做二分，check 函数验证可行性"],
   problems:["有序数组查找","最小化最大值","分配问题","求平方根"],
   keywords:["有序","折半","二分答案","单调性"],
   tip:"二分答案是提高级必考技巧，关键是构造单调的 check 函数。"},

  {n:"倍增法", d:2, raw:"【4】", section:"2.1.4 算法·基础算法",
   summary:"利用 2 的幂次预处理，将线性跳跃加速为对数跳跃，LCA 的经典基础。",
   complexity:"预处理 O(n log n)，查询 O(log n) | 空间 O(n log n)",
   syllabus:"§2.1.4 基础算法·倍增法【4】",
   ideas:["预处理 fa[v][k] = 从 v 往上跳 2ᵏ 步的祖先","查询时将跳跃次数拆为二进制各位","稀疏表（ST表）也是倍增的应用"],
   problems:["LCA（最近公共祖先）","树上路径第 k 个节点","RMQ 区间最值"],

// ── 颜色配置 ──────────────────────────────────────────────
const DC = {1:'#ff4d4d',2:'#ff7a00',3:'#ffd000',4:'#00ff88'};
const DL = {1:'难度 1-2 · 入门级基础',2:'难度 3-4 · 入门级核心',3:'难度 5-6 · 提高级',4:'难度 7 · 提高级核心'};

// ── 浮动标签 ─────────────────────────────────────────────
const box=document.getElementById('box');
const items=[];let paused=false;
class Label{
  constructor(info){
    const el=document.createElement('div');
    el.className=`tag diff-${info.d}`;
    el.innerText=info.n;
    box.appendChild(el);
    this.el=el;this.info=info;
    this.w=el.offsetWidth;this.h=el.offsetHeight;
    this.x=Math.random()*(innerWidth-this.w);
    this.y=Math.random()*(innerHeight-this.h);
    const spd=0.5+info.d*0.1;
    this.vx=(Math.random()-.5)*spd*2;
    this.vy=(Math.random()-.5)*spd*2;
    this.hover=false;
    el.onmouseenter=()=>this.hover=true;
    el.onmouseleave=()=>this.hover=false;
    el.onclick=()=>openPanel(info);
  }
  move(){
    if(!this.hover&&!paused){
      this.x+=this.vx;this.y+=this.vy;
      if(this.x<=0||this.x+this.w>=innerWidth)this.vx*=-1;
      if(this.y<=0||this.y+this.h>=innerHeight)this.vy*=-1;
    }
    this.el.style.transform=`translate(${this.x}px,${this.y}px)`;
  }
}
algos.forEach(a=>items.push(new Label(a)));
(function tagF(){items.forEach(i=>i.move());requestAnimationFrame(tagF);})();
window.onresize=()=>{resize();items.forEach(i=>{i.x=Math.min(i.x,innerWidth-i.w);i.y=Math.min(i.y,innerHeight-i.h);});};

// ── 详情面板（静态内容，即时显示）───────────────────────
const panel=document.getElementById('panel');
const pTitle=document.getElementById('pt');
const pBadge=document.getElementById('pb');
const pContent=document.getElementById('pc');

function closePanel(){panel.classList.remove('open');paused=false;}

function mkBadge(text,color){
  const s=document.createElement('span');
  s.className='bdg';s.textContent=text;
  s.style.color=color;s.style.borderColor=color+'55';s.style.background=color+'10';
  return s;
}

function openPanel(info){
  paused=true;
  pTitle.textContent=info.n;
  pBadge.innerHTML='';
  const c=DC[info.d];
  pBadge.appendChild(mkBadge(DL[info.d],c));
  pBadge.appendChild(mkBadge(info.section,'#5577aa'));
  pBadge.appendChild(mkBadge(info.raw,'#445566'));

  pContent.innerHTML=`
<div class="sec">
  <div class="sec-lbl">简介</div>
  <div class="sec-body">${info.summary}</div>
</div>
<div class="sec">
  <div class="sec-lbl">大纲原文定位</div>
  <div class="sylbox">${info.syllabus}</div>
</div>
<div class="sec">
  <div class="sec-lbl">复杂度</div>
  <div class="cbox">${info.complexity}</div>
</div>
<div class="sec">
  <div class="sec-lbl">核心思想</div>
  <ul class="ilist">${info.ideas.map(s=>`<li>${s}</li>`).join('')}</ul>
</div>
<div class="sec">
  <div class="sec-lbl">经典题目 / 题型</div>
  <ul class="ilist">${info.problems.map(s=>`<li>${s}</li>`).join('')}</ul>
</div>
<div class="sec">
  <div class="sec-lbl">关键词</div>
  <div class="chip-row">${info.keywords.map(k=>`<span class="chip">${k}</span>`).join('')}</div>
</div>
<div class="sec" style="margin-bottom:0">
  <div class="sec-lbl">学习建议</div>
  <div class="sec-body">${info.tip}</div>
</div>`;

  document.getElementById('pb-body').scrollTop=0;
  panel.classList.add('open');
}

document.getElementById('box').addEventListener('click',e=>{
  if(!e.target.classList.contains('tag'))closePanel();
});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插入排序 - 气泡动画演示</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --panel-bg: #ffffff;
            --text: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 95vw;
            max-width: 1400px;
            background: var(--panel-bg);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        .header h1 {
            font-size: 1.6em;
            letter-spacing: 2px;
            color: #2c3e50;
        }
        .header .subtitle {
            color: #888;
            font-size: 0.85em;
            margin-top: 2px;
        }

        .bubble-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-evenly;
            padding: 90px 10px 20px;
            min-height: 270px;
            background: linear-gradient(180deg, #f8faff 0%, #e8f0fe 100%);
            border-radius: 20px;
            border: 2px dashed #dde4f0;
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        .bubble-slot {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            max-width: 140px;
            min-height: 140px;
        }
        /* 每个气泡用唯一的 uid 标识，不随位置变化 */
        .bubble-wrapper {
            position: absolute;
            bottom: 0;
            transform: translateX(-50%);
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1), bottom 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform, left, bottom;
            backface-visibility: hidden;
        }
        .bubble-wrapper.key-lifted {
            z-index: 20;
        }
        .bubble-wrapper.no-transition {
            transition: none !important;
        }
        .bubble-wrapper.shifting {
            z-index: 5;
        }
        .bubble-wrapper.removing {
            opacity: 0;
            transform: translateX(-50%) scale(0.3);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .bubble {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            transition: box-shadow 0.3s ease;
            cursor: default;
            user-select: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            box-shadow: 0 6px 20px rgba(0,0,0,0.10), inset 0 -3px 6px rgba(0,0,0,0.08), inset 0 3px 6px rgba(255,255,255,0.25);
            position: relative;
        }
        .bubble::after {
            content: '';
            position: absolute;
            width: 22%;
            height: 18%;
            background: rgba(255,255,255,0.35);
            border-radius: 50%;
            top: 16%;
            left: 28%;
            transform: rotate(-20deg);
        }
        .bubble.key-glow {
            animation: keyGlow 0.7s ease infinite alternate;
            box-shadow: 0 0 0 6px rgba(255,165,2,0.8), 0 10px 35px rgba(255,165,2,0.6);
        }
        .bubble.comparing {
            animation: wobble 0.2s ease infinite alternate;
            box-shadow: 0 0 0 5px rgba(255,107,107,0.6), 0 6px 25px rgba(255,107,107,0.4);
        }
        .bubble.sorted {
            box-shadow: 0 0 0 3px rgba(107,203,119,0.4), 0 4px 14px rgba(107,203,119,0.12);
        }
        .bubble.insert-flash {
            animation: insertPop 0.6s ease;
            box-shadow: 0 0 0 6px rgba(107,203,119,0.8), 0 8px 30px rgba(107,203,119,0.5);
        }
        @keyframes keyGlow {
            0% { box-shadow: 0 0 0 6px rgba(255,165,2,0.6), 0 10px 35px rgba(255,165,2,0.4); }
            100% { box-shadow: 0 0 0 10px rgba(255,165,2,1), 0 14px 45px rgba(255,165,2,0.8); }
        }
        @keyframes wobble {
            0% { transform: scale(1); }
            100% { transform: scale(1.07); }
        }
        @keyframes insertPop {
            0% { transform: scale(1.3); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        .bubble-label {
            font-size: 0.62em;
            color: #999;
            margin-top: 4px;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .info-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .step-desc {
            flex: 1;
            min-width: 280px;
            text-align: center;
            padding: 10px 14px;
            background: #fefefe;
            border-radius: 10px;
            border: 1px solid #eee;
            font-size: 0.95em;
            color: #555;
            line-height: 1.5;
        }
        .step-desc .strong { color: #e74c3c; font-weight: bold; }
        .stats {
            display: flex;
            gap: 12px;
            font-size: 0.8em;
            color: #888;
        }
        .stats span {
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        button {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            border: none;
            font-size: 0.9em;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-start { background: #4d96ff; color: #fff; }
        .btn-next { background: #6bcb77; color: #fff; }
        .btn-auto { background: #ffa502; color: #fff; }
        .btn-reset { background: #e0e0e0; color: #333; }
        .btn-speed { background: #a855f7; color: #fff; font-size: 0.8em; padding: 8px 14px; }

        @media (max-width: 700px) {
            .bubble-container { padding: 60px 4px 14px; min-height: 200px; }
            button { padding: 8px 14px; font-size: 0.78em; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📥 插入排序 · 气泡动画</h1>
            <p class="subtitle">选中数字提上去 → 前面比我大的逐个往后挪 → 我落下来插入</p>
        </div>

        <div class="bubble-container" id="bubbleContainer"></div>

        <div class="info-bar">
            <div class="step-desc" id="stepDesc">点击 <b>▶ 开始</b> 启动插入排序</div>
            <div class="stats">
                <span>🔑 key: <b id="currentKey">-</b></span>
                <span>📊 比较: <b id="cmpCount">0</b> 次</span>
                <span>✅ 已排: <b id="sortedCount">0</b> 个</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn-start" id="btnStart" onclick="startDemo()">▶ 开始</button>
            <button class="btn-next" id="btnNext" onclick="nextStep()" disabled>⏭ 下一步</button>
            <button class="btn-auto" id="btnAuto" onclick="toggleAuto()" disabled>⏩ 自动播放</button>
            <button class="btn-speed" id="btnSpeed" onclick="changeSpeed()">⏱ 速度: 1x</button>
            <button class="btn-reset" id="btnReset" onclick="resetAll()">🔄 重置</button>
        </div>
    </div>

    <script>
        const INIT_DATA = [5, 2, 4, 6, 1, 3, 9, 7, 8, 0];
        const TOTAL = INIT_DATA.length;
        const BASE_SIZE = 44;
        const MAX_SIZE = 88;
        const SIZE_RANGE = MAX_SIZE - BASE_SIZE;
        const LIFT_Y = 52;

        let slotPositions = [];
        let frames = [];
        let currentFrame = -1;
        let autoTimer = null;
        let autoPlaying = false;
        let speedIdx = 1;
        const speeds = [1600, 1000, 600, 350];
        let busy = false;

        // 关键：维护"当前气泡在哪个 slot"的映射
        // bubbleSlots[i] = slot 编号（气泡 i 当前位于哪个 slot）
        // 反过来说：slot 的 id 不变，气泡的 uid 也不变，只是位置在变
        let bubbleSlots = []; // bubbleSlots[uid] = currentSlot
        let slotBubbles = []; // slotBubbles[slot] = uid (哪个气泡在这个 slot)
        let keyUid = -1; // 被提起的 key 的 uid
        let nextUid = 0;

        function getSize(val) {
            const range = 9 - 0 || 1;
            return BASE_SIZE + ((val - 0) / range) * SIZE_RANGE;
        }

        function getColor(val) {
            const range = 9 - 0 || 1;
            const hue = 195 + ((val - 0) / range) * 50;
            const sat = 50 + ((val - 0) / range) * 30;
            const light = 56 - ((val - 0) / range) * 10;
            return `radial-gradient(circle at 35% 30%, hsl(${hue},${sat}%,${light+14}%), hsl(${hue},${sat}%,${light}%))`;
        }

        function measureSlots() {
            slotPositions = [];
            const container = document.getElementById('bubbleContainer');
            const slots = container.querySelectorAll('.bubble-slot');
            const cr = container.getBoundingClientRect();
            slots.forEach(s => {
                const r = s.getBoundingClientRect();
                slotPositions.push({
                    left: r.left - cr.left + r.width / 2,
                    bottom: cr.height - (r.bottom - cr.top),
                });
            });
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        // ==================== 帧生成 ====================
        function buildFrames() {
            frames = [];
            const arr = [...INIT_DATA];
            let cmpCount = 0;

            // 建立 uid 映射：uid 从 0 开始，等于初始位置
            // 初始: uid=i 的气泡值 arr[i]，位于 slot i

            frames.push({
                type: 'init',
                arr: [...arr],
                keyUid: -1,
                keyVal: null,
                compareSlot: -1,
                sortedCount: 1,
                cmpCount: 0,
                desc: '🔰 <b>初始状态</b>：第0个 arr[0]=' + arr[0] + ' 视为已排序',
            });

            for (let i = 1; i < TOTAL; i++) {
                const key = arr[i];
                const keyU = i; // key 的 uid 就是 i（初始位置）
                let j = i - 1;

                frames.push({
                    type: 'lift',
                    arr: [...arr],
                    keyUid: keyU,
                    keyVal: key,
                    compareSlot: -1,
                    sortedCount: i,
                    cmpCount: cmpCount,
                    desc: `🖐 <b>选中</b> arr[${i}]=<span class="strong">${key}</span>，提起来`,
                });

                while (j >= 0) {
                    cmpCount++;
                    frames.push({
                        type: 'compare',
                        arr: [...arr],
                        keyUid: keyU,
                        keyVal: key,
                        compareSlot: j,
                        sortedCount: i,
                        cmpCount: cmpCount,
                        desc: `👀 <b>比较</b>：key=<span class="strong">${key}</span> 和 arr[${j}]=<span class="strong">${arr[j]}</span>`,
                    });

                    if (arr[j] > key) {
                        frames.push({
                            type: 'shift',
                            arr: [...arr],
                            keyUid: keyU,
                            keyVal: key,
                            compareSlot: -1,
                            sortedCount: i,
                            cmpCount: cmpCount,
                            desc: `➡️ arr[${j}]=${arr[j]} > key=${key} → <b>向右移到 ${j+1}</b>`,
                            shiftFrom: j,
                            shiftTo: j + 1,
                        });

                        arr[j + 1] = arr[j];
                        j--;
                    } else {
                        frames.push({
                            type: 'found',
                            arr: [...arr],
                            keyUid: keyU,
                            keyVal: key,
                            compareSlot: j,
                            sortedCount: i,
                            cmpCount: cmpCount,
                            desc: `🛑 arr[${j}]=${arr[j]} ≤ key=${key} → 插入位置 <b>${j+1}</b>`,
                            insertAt: j + 1,
                        });
                        break;
                    }
                }

                if (j < 0) {
                    frames.push({
                        type: 'found',
                        arr: [...arr],
                        keyUid: keyU,
                        keyVal: key,
                        compareSlot: -1,
                        sortedCount: i,
                        cmpCount: cmpCount,
                        desc: `🛑 已到最左边 → 插入位置 <b>0</b>`,
                        insertAt: 0,
                    });
                }

                const insertPos = j + 1;
                arr[insertPos] = key;

                frames.push({
                    type: 'insert',
                    arr: [...arr],
                    keyUid: keyU,
                    keyVal: key,
                    compareSlot: -1,
                    sortedCount: i + 1,
                    cmpCount: cmpCount,
                    desc: `📥 <b>落下插入！</b>key=${key} 放入 arr[${insertPos}]，前 ${i+1} 个已排好 ✅`,
                    insertAt: insertPos,
                });
            }

            frames.push({
                type: 'done',
                arr: [...arr],
                keyUid: -1,
                keyVal: null,
                compareSlot: -1,
                sortedCount: TOTAL,
                cmpCount: cmpCount,
                desc: `🎉 <b>排序完成！</b>共比较 ${cmpCount} 次，结果：${arr.join(', ')}`,
            });
        }

        // ==================== DOM 操作 ====================
        function createBubbleEl(val, extraClasses) {
            const size = getSize(val);
            const fs = Math.max(12, size * 0.36);
            return `<div class="bubble ${extraClasses||''}" style="width:${size}px;height:${size}px;line-height:${size}px;font-size:${fs}px;background:${getColor(val)};">${val}</div>`;
        }

        function updateBubbleEl(wrapper, val, extraClasses) {
            const bubble = wrapper.querySelector('.bubble');
            if (!bubble) return;
            const size = getSize(val);
            const fs = Math.max(12, size * 0.36);
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.lineHeight = size + 'px';
            bubble.style.fontSize = fs + 'px';
            bubble.style.background = getColor(val);
            bubble.textContent = val;
            bubble.className = 'bubble ' + (extraClasses || '');
        }

        function placeWrapper(wrapper, slotIdx, lifted) {
            if (!slotPositions[slotIdx]) return;
            const p = slotPositions[slotIdx];
            wrapper.style.left = p.left + 'px';
            wrapper.style.bottom = (lifted ? p.bottom + LIFT_Y : p.bottom) + 'px';
        }

        // 获取某个 slot 上的气泡元素（如果有）
        function getBubbleAtSlot(slot) {
            const container = document.getElementById('bubbleContainer');
            const allWrappers = container.querySelectorAll('.bubble-wrapper');
            for (const w of allWrappers) {
                const uid = parseInt(w.getAttribute('data-uid'));
                if (bubbleSlots[uid] === slot && !w.classList.contains('removing')) {
                    return w;
                }
            }
            return null;
        }

        // 获取 uid 的气泡元素
        function getBubbleByUid(uid) {
            const container = document.getElementById('bubbleContainer');
            return container.querySelector(`.bubble-wrapper[data-uid="${uid}"]`);
        }

        // ==================== 帧执行 ====================
        async function executeFrame(frame) {
            const container = document.getElementById('bubbleContainer');

            if (frame.type === 'init') {
                container.innerHTML = '';
                // 创建 slots
                for (let s = 0; s < TOTAL; s++) {
                    const slot = document.createElement('div');
                    slot.className = 'bubble-slot';
                    slot.id = 'slot-' + s;
                    container.appendChild(slot);
                }
                // 初始化映射
                bubbleSlots = [];
                slotBubbles = [];
                for (let uid = 0; uid < TOTAL; uid++) {
                    bubbleSlots[uid] = uid;
                    slotBubbles[uid] = uid;
                }
                keyUid = -1;
                // 创建气泡
                for (let uid = 0; uid < TOTAL; uid++) {
                    const w = document.createElement('div');
                    w.className = 'bubble-wrapper no-transition';
                    w.setAttribute('data-uid', uid);
                    w.style.position = 'absolute';
                    w.style.bottom = '0';
                    w.innerHTML = createBubbleEl(frame.arr[uid], uid === 0 ? 'sorted' : '') +
                        `<div class="bubble-label">[${uid}]</div>`;
                    container.appendChild(w);
                }
                void container.offsetHeight;
                await sleep(30);
                measureSlots();
                for (let uid = 0; uid < TOTAL; uid++) {
                    const w = getBubbleByUid(uid);
                    if (w) placeWrapper(w, bubbleSlots[uid], false);
                }
                await sleep(30);
                for (let uid = 0; uid < TOTAL; uid++) {
                    const w = getBubbleByUid(uid);
                    if (w) w.classList.remove('no-transition');
                }
                updateStats(frame);
                return;
            }

            if (frame.type === 'lift') {
                keyUid = frame.keyUid;
                const w = getBubbleByUid(keyUid);
                if (w) {
                    w.classList.add('key-lifted');
                    const b = w.querySelector('.bubble');
                    if (b) { b.classList.remove('sorted');
                        b.classList.add('key-glow'); }
                    placeWrapper(w, bubbleSlots[keyUid], true);
                }
                updateStats(frame);
                await sleep(600);
                return;
            }

            if (frame.type === 'compare') {
                const prevFrame = frames[currentFrame - 1];
                if (prevFrame && prevFrame.compareSlot >= 0) {
                    const pw = getBubbleAtSlot(prevFrame.compareSlot);
                    if (pw) { const pb = pw.querySelector('.bubble'); if (pb) pb.classList.remove('comparing'); }
                }
                if (frame.compareSlot >= 0) {
                    const w = getBubbleAtSlot(frame.compareSlot);
                    if (w) { const b = w.querySelector('.bubble'); if (b) b.classList.add('comparing'); }
                }
                updateStats(frame);
                await sleep(600);
                return;
            }

            if (frame.type === 'shift') {
                const from = frame.shiftFrom;
                const to = frame.shiftTo;

                // 找到位于 slot=from 的气泡
                const fromUid = slotBubbles[from];
                const w = getBubbleByUid(fromUid);
                if (!w) { updateStats(frame); return; }

                // 目标 slot 上有没有气泡？有的话先移除（但不要移除 key）
                const toUid = slotBubbles[to];
                if (toUid !== undefined && toUid !== keyUid) {
                    const toW = getBubbleByUid(toUid);
                    if (toW && !toW.classList.contains('key-lifted')) {
                        toW.classList.add('removing');
                        await sleep(280);
                        if (toW.parentNode) { toW.innerHTML = '';
                            toW.remove(); }
                        void container.offsetHeight;
                    }
                }

                // 更新映射
                slotBubbles[to] = fromUid;
                slotBubbles[from] = -1; // from slot 现在空了（key 被提起，或已移走）
                bubbleSlots[fromUid] = to;

                // 移动气泡
                w.classList.add('shifting');
                const label = w.querySelector('.bubble-label');
                if (label) label.textContent = '[' + to + ']';
                void w.offsetHeight;
                placeWrapper(w, to, false);

                updateStats(frame);
                await sleep(850);
                w.classList.remove('shifting');
                return;
            }

            if (frame.type === 'found') {
                if (frame.compareSlot >= 0) {
                    const w = getBubbleAtSlot(frame.compareSlot);
                    if (w) { const b = w.querySelector('.bubble'); if (b) b.classList.remove('comparing'); }
                }
                updateStats(frame);
                await sleep(500);
                return;
            }

            if (frame.type === 'insert') {
                const pos = frame.insertAt;

                // 目标 slot 上有气泡吗？（可能是之前 shift 时没清干净的）
                const existingUid = slotBubbles[pos];
                if (existingUid !== undefined && existingUid !== keyUid) {
                    const exW = getBubbleByUid(existingUid);
                    if (exW && !exW.classList.contains('key-lifted')) {
                        exW.classList.add('removing');
                        await sleep(280);
                        if (exW.parentNode) { exW.innerHTML = '';
                            exW.remove(); }
                        void container.offsetHeight;
                    }
                }

                // key 气泡落下
                const w = getBubbleByUid(keyUid);
                if (w) {
                    w.classList.remove('key-lifted');
                    updateBubbleEl(w, frame.keyVal, 'sorted insert-flash');
                    const label = w.querySelector('.bubble-label');
                    if (label) label.textContent = '[' + pos + ']';

                    // 更新映射
                    const oldSlot = bubbleSlots[keyUid];
                    if (oldSlot >= 0 && slotBubbles[oldSlot] === keyUid) {
                        slotBubbles[oldSlot] = -1;
                    }
                    slotBubbles[pos] = keyUid;
                    bubbleSlots[keyUid] = pos;

                    void w.offsetHeight;
                    placeWrapper(w, pos, false);
                    setTimeout(() => {
                        const b = w.querySelector('.bubble');
                        if (b) b.classList.remove('insert-flash');
                    }, 600);
                }

                // 更新 sorted
                for (let s = 0; s < frame.sortedCount; s++) {
                    const uid = slotBubbles[s];
                    if (uid >= 0) {
                        const bw = getBubbleByUid(uid);
                        if (bw) {
                            const b = bw.querySelector('.bubble');
                            if (b && !b.classList.contains('key-glow')) b.classList.add('sorted');
                        }
                    }
                }

                keyUid = -1;
                updateStats(frame);
                await sleep(650);
                return;
            }

            if (frame.type === 'done') {
                for (let uid = 0; uid < TOTAL; uid++) {
                    const w = getBubbleByUid(uid);
                    if (w) {
                        const b = w.querySelector('.bubble');
                        if (b) b.classList.add('sorted');
                    }
                }
                updateStats(frame);
                await sleep(400);
                return;
            }
        }

        function updateStats(frame) {
            document.getElementById('cmpCount').textContent = frame.cmpCount;
            document.getElementById('sortedCount').textContent = frame.sortedCount;
            document.getElementById('currentKey').textContent = frame.keyVal !== null ? frame.keyVal : '-';
            document.getElementById('stepDesc').innerHTML = frame.desc;
        }

        // ==================== 播放控制 ====================
        async function goToFrame(idx) {
            if (busy) return;
            if (idx < 0 || idx >= frames.length) return;
            busy = true;
            currentFrame = idx;
            await executeFrame(frames[idx]);
            const last = idx >= frames.length - 1;
            document.getElementById('btnNext').disabled = last;
            document.getElementById('btnAuto').disabled = last;
            if (last && autoPlaying) stopAuto();
            busy = false;
        }

        async function nextStep() {
            if (busy) return;
            if (currentFrame < frames.length - 1) {
                await goToFrame(currentFrame + 1);
            }
        }

        function startDemo() {
            buildFrames();
            currentFrame = -1;
            keyUid = -1;
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnNext').disabled = false;
            document.getElementById('btnAuto').disabled = false;
            nextStep();
        }

        function toggleAuto() { autoPlaying ? stopAuto() : startAuto(); }

        function startAuto() {
            autoPlaying = true;
            document.getElementById('btnAuto').textContent = '⏸ 暂停';
            document.getElementById('btnNext').disabled = true;
            const loop = async () => {
                if (!autoPlaying) return;
                if (busy) { autoTimer = setTimeout(loop, 150); return; }
                if (currentFrame < frames.length - 1) {
                    await goToFrame(currentFrame + 1);
                    autoTimer = setTimeout(loop, speeds[speedIdx]);
                } else { stopAuto(); }
            };
            autoTimer = setTimeout(loop, 200);
        }

        function stopAuto() {
            autoPlaying = false;
            clearTimeout(autoTimer);
            autoTimer = null;
            document.getElementById('btnAuto').textContent = '⏩ 自动播放';
            document.getElementById('btnNext').disabled = (currentFrame >= frames.length - 1);
        }

        function changeSpeed() {
            speedIdx = (speedIdx + 1) % speeds.length;
            document.getElementById('btnSpeed').textContent = '⏱ 速度: ' + ['1x (慢)','2x','3x','4x (快)'][speedIdx];
        }

        function resetAll() {
            stopAuto();
            frames = [];
            currentFrame = -1;
            busy = false;
            keyUid = -1;
            bubbleSlots = [];
            slotBubbles = [];
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnNext').disabled = true;
            document.getElementById('btnAuto').disabled = true;
            document.getElementById('btnAuto').textContent = '⏩ 自动播放';
            document.getElementById('btnSpeed').textContent = '⏱ 速度: 1x';
            speedIdx = 1;
            document.getElementById('cmpCount').textContent = '0';
            document.getElementById('sortedCount').textContent = '0';
            document.getElementById('currentKey').textContent = '-';
            document.getElementById('stepDesc').innerHTML = '点击 <b>▶ 开始</b> 启动插入排序';

            const container = document.getElementById('bubbleContainer');
            container.innerHTML = '';
            for (let s = 0; s < TOTAL; s++) {
                const slot = document.createElement('div');
                slot.className = 'bubble-slot';
                slot.id = 'slot-' + s;
                container.appendChild(slot);
            }
            for (let uid = 0; uid < TOTAL; uid++) {
                const w = document.createElement('div');
                w.className = 'bubble-wrapper no-transition';
                w.setAttribute('data-uid', uid);
                w.style.position = 'absolute';
                w.style.bottom = '0';
                w.innerHTML = createBubbleEl(INIT_DATA[uid], uid === 0 ? 'sorted' : '') +
                    `<div class="bubble-label">[${uid}]</div>`;
                container.appendChild(w);
            }
            void container.offsetHeight;
            requestAnimationFrame(() => {
                measureSlots();
                for (let uid = 0; uid < TOTAL; uid++) {
                    const w = container.querySelector(`.bubble-wrapper[data-uid="${uid}"]`);
                    if (w) placeWrapper(w, uid, false);
                }
                requestAnimationFrame(() => {
                    for (let uid = 0; uid < TOTAL; uid++) {
                        const w = container.querySelector(`.bubble-wrapper[data-uid="${uid}"]`);
                        if (w) w.classList.remove('no-transition');
                    }
                });
            });
        }

        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') { e.preventDefault();
                nextStep(); } else if (e.key === ' ') { e.preventDefault();
                toggleAuto(); } else if (e.key === 'r') { e.preventDefault();
                resetAll(); }
        });

        window.addEventListener('resize', () => {
            if (frames.length > 0 && currentFrame >= 0 && !busy) {
                measureSlots();
                for (let uid = 0; uid < TOTAL; uid++) {
                    const w = getBubbleByUid(uid);
                    if (w) {
                        const lifted = (uid === keyUid);
                        placeWrapper(w, bubbleSlots[uid], lifted);
                    }
                }
            }
        });

        resetAll();
    </script>
</body>
</html>
